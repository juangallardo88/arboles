<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OxyFault · Fault Tree Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230f3d56'/><text x='16' y='21' font-size='13' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>O₂</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">O₂</div>
      <div>
        <h1>OxyFault</h1>
        <p>Fault Tree Analysis · ICU medical oxygen supply</p>
      </div>
    </div>

    <div class="top-risk" id="topRisk" title="Probability of the top event">
      <span class="top-risk-label">Top event probability</span>
      <span class="top-risk-value" id="topRiskValue">—</span>
      <span class="top-risk-hint" id="topRiskHint"></span>
    </div>

    <div class="top-actions">
      <button class="btn ghost" id="exportBtn" type="button">Export JSON</button>
      <label class="btn ghost" for="importInput">Import JSON</label>
      <input type="file" id="importInput" accept=".json,application/json" hidden>
      <button class="btn ghost danger-text" id="resetBtn" type="button">Reset case</button>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-panel" aria-label="Fault tree diagram">
      <div class="canvas-toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="searchInput" type="search" placeholder="Search events (id, label, notes)…" autocomplete="off">
          <span id="searchCount" class="search-count"></span>
        </div>

        <div class="segmented" role="group" aria-label="Color mode">
          <button type="button" class="active" data-mode="logic">Risk view</button>
          <button type="button" data-mode="class">Class view</button>
        </div>

        <div class="zoom-controls">
          <button class="icon-btn" id="zoomOut" type="button" title="Zoom out">−</button>
          <button class="icon-btn" id="zoomIn" type="button" title="Zoom in">+</button>
          <button class="icon-btn wide" id="fitBtn" type="button" title="Fit tree">Fit</button>
        </div>
      </div>

      <div class="canvas" id="canvas">
        <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg">
          <g id="viewport"></g>
        </svg>
        <div class="legend" id="legend"></div>
        <div class="traversal-banner" id="traversalBanner" hidden></div>
      </div>
    </section>

    <aside class="side-panel">
      <nav class="tabs" role="tablist">
        <button role="tab" class="active" data-tab="event">Event</button>
        <button role="tab" data-tab="add">Add</button>
        <button role="tab" data-tab="risk">Risk</button>
        <button role="tab" data-tab="structure">Structure</button>
        <button role="tab" data-tab="text">Text</button>
      </nav>

      <!-- EVENT -->
      <section class="tab-body active" data-panel="event" id="eventPanel">
        <div class="empty">Select an event in the tree to see its details.</div>
      </section>

      <!-- ADD -->
      <section class="tab-body" data-panel="add">
        <h2>Add an event</h2>
        <p class="muted">New events hang from an AND / OR gate. Basic events are the leaves of the tree.</p>
        <form id="addForm" class="form">
          <label>Parent gate
            <select name="parent_id" id="addParent" required></select>
          </label>
          <div class="field">
            <span class="field-label">Type</span>
            <div class="segmented full" id="addKind">
              <button type="button" data-kind="BASIC" class="active">Basic event</button>
              <button type="button" data-kind="OR">OR gate</button>
              <button type="button" data-kind="AND">AND gate</button>
            </div>
            <p class="hint" id="addKindHint"></p>
          </div>
          <label>Label
            <input name="label" maxlength="80" required placeholder="e.g. Power outage stops the compressor">
          </label>
          <label id="addProbField">Probability (0 – 1)
            <input name="probability" type="number" step="any" min="0" max="1" value="0.01">
          </label>
          <label>Notes
            <textarea name="description" rows="3" placeholder="Optional details"></textarea>
          </label>
          <button class="btn primary" type="submit">Add event</button>
        </form>
      </section>

      <!-- RISK -->
      <section class="tab-body" data-panel="risk" id="riskPanel"></section>

      <!-- STRUCTURE -->
      <section class="tab-body" data-panel="structure" id="structurePanel"></section>

      <!-- TEXT -->
      <section class="tab-body" data-panel="text">
        <h2>Text view</h2>
        <p class="muted">Generated by <code>anytree.RenderTree</code> on the server.</p>
        <pre class="ascii" id="asciiView"></pre>
        <button class="btn ghost" id="copyAscii" type="button">Copy</button>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/format.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tree-view.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
